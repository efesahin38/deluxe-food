<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Zahlung Erfolgreich - Deluxe Food</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; background-color: #F3F4F6;
      text-align: center; padding: 20px;
    }
    h1 { color: #10B981; font-size: 2.5rem; margin-bottom: 10px; }
    p { color: #4B5563; font-size: 1.1rem; margin-bottom: 30px; }
    .btn {
      background-color: #E8192C; color: white; text-decoration: none;
      padding: 12px 24px; border-radius: 99px; font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    
    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>🎉 Zahlung Erfolgreich!</h1>
  <p>Vielen Dank für Ihre Bestellung. Ihre Zahlung wurde bestätigt und wir bereiten Ihr Essen vor.</p>
  <a href="/" class="btn">Zurück zur Startseite</a>
</body>
</html>
